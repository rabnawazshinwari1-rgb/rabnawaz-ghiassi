<title>Rabnawaz Shinwari</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#08111f;--ink2:#0c1a2e;--ink3:#101f36;--ink4:#152540;
  --gold:#b8935a;--gold2:#d4a96a;--gold3:#e8c48a;
  --gold-light:rgba(184,147,90,0.08);--gold-glow:rgba(184,147,90,0.15);
  --cream:#f2ead8;--cream2:#e0d4b8;
  --text:#c8bca0;--text2:#907c60;--text3:#504030;
  --line:rgba(184,147,90,0.16);--line2:rgba(240,230,200,0.06);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--ink);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:var(--gold)}

/* ═══ NAV ═══ */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:999;height:60px;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:0 1.25rem;
  background:rgba(8,17,31,0.93);
  backdrop-filter:blur(24px);border-bottom:1px solid var(--line);
}
.nav-logo{
  font-family:'Cormorant Garamond',serif;font-weight:500;
  font-size:1rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--cream);flex-shrink:0;display:flex;align-items:center;gap:0.5rem;
}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold-glow);flex-shrink:0}
.nav-links{display:flex;list-style:none}
.nav-links a{
  font-size:0.56rem;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--text2);padding:0.4rem 0.55rem;transition:color 0.2s;white-space:nowrap;
}
.nav-links a:hover{color:var(--gold2)}
.nav-langs{display:flex;gap:2px;flex-shrink:0}
.nlang{
  font-family:'Cormorant Garamond',serif;font-size:0.7rem;letter-spacing:0.1em;
  color:var(--text2);padding:0.22rem 0.5rem;border:1px solid transparent;transition:all 0.2s;
}
.nlang.on{color:var(--gold);border-color:var(--line)}
.nlang:hover{color:var(--gold2)}

/* ═══ HERO ═══ */
.hero{
  min-height:100svh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:70px 1.25rem 3rem;position:relative;overflow:hidden;
}
.hero-atm{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 100% 60% at 50% -5%,rgba(21,37,64,0.9) 0%,transparent 55%),
    radial-gradient(ellipse 70% 50% at 10% 90%,rgba(12,26,46,0.6) 0%,transparent 50%),
    radial-gradient(ellipse 50% 40% at 90% 60%,rgba(184,147,90,0.04) 0%,transparent 50%);
}
.hero-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:radial-gradient(ellipse 90% 80% at 50% 50%,black 0%,transparent 72%);
}
.hero-inner{position:relative;z-index:1;max-width:860px;width:100%}

.hero-badge{
  display:inline-flex;align-items:center;gap:0.6rem;
  font-size:0.52rem;letter-spacing:0.38em;text-transform:uppercase;color:var(--gold);
  margin-bottom:2rem;
  opacity:0;animation:up 0.8s 0.1s ease forwards;
}
.hero-badge-line{width:1.75rem;height:1px;background:currentColor;opacity:0.5}

.hero-h1{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(2.47rem, 8.45vw, 6.82rem);
  line-height:0.86;letter-spacing:0.05em;text-transform:uppercase;
  opacity:0;animation:up 1s 0.22s ease forwards;
}
.h1-first{display:block;color:var(--cream)}
.h1-last{
  display:block;color:transparent;
  -webkit-text-stroke:1.5px var(--gold2);
  letter-spacing:0.09em;
}

.hero-sep{
  display:flex;align-items:center;justify-content:center;gap:0.9rem;
  margin:1.75rem auto;
  opacity:0;animation:fade 0.8s 0.42s ease forwards;
}
.hsep-l{width:2.5rem;height:1px;background:linear-gradient(to right,transparent,var(--gold))}
.hsep-l.r{background:linear-gradient(to left,transparent,var(--gold))}
.hsep-d{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 10px var(--gold-glow)}

.hero-tagline{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
  font-size:clamp(1rem,3.5vw,1.45rem);line-height:1.7;
  color:var(--text);max-width:580px;margin:0 auto;
  opacity:0;animation:up 0.9s 0.5s ease forwards;
}
.hero-tagline strong{color:var(--cream2);font-style:normal;font-weight:400}

.hero-roles{
  display:flex;align-items:center;justify-content:center;gap:0.75rem;
  margin-top:1.5rem;flex-wrap:wrap;
  opacity:0;animation:up 0.8s 0.58s ease forwards;
}
.role-pill{
  font-size:0.52rem;letter-spacing:0.18em;text-transform:uppercase;
  border:1px solid var(--line);padding:0.3rem 0.8rem;color:var(--gold);
  background:var(--gold-light);
}
.role-sep{color:var(--text3);font-size:0.6rem}

.hero-cta{
  display:flex;align-items:center;justify-content:center;
  gap:0.85rem;margin-top:2.25rem;flex-wrap:wrap;
  opacity:0;animation:up 0.9s 0.66s ease forwards;
}
.btn-g{
  font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;font-weight:400;
  padding:0.85rem 2rem;background:var(--gold);color:var(--ink);
  border:1px solid var(--gold);transition:all 0.25s;display:inline-block;
}
.btn-g:hover{background:var(--gold2);border-color:var(--gold2);transform:translateY(-2px);box-shadow:0 10px 36px var(--gold-glow)}
.btn-o{
  font-size:0.58rem;letter-spacing:0.22em;text-transform:uppercase;font-weight:400;
  padding:0.85rem 2rem;background:transparent;color:var(--cream);
  border:1px solid var(--line2);transition:all 0.25s;display:inline-block;
}
.btn-o:hover{border-color:var(--line);color:var(--gold2)}

.hero-stats{
  display:inline-flex;border:1px solid var(--line);margin-top:2.75rem;
  opacity:0;animation:up 0.9s 0.78s ease forwards;
}
.hstat{padding:0.8rem 1.25rem;text-align:center;border-right:1px solid var(--line)}
.hstat:last-child{border-right:none}
.hstat-n{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.5rem;color:var(--gold2);display:block;line-height:1}
.hstat-l{font-size:0.46rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text2);display:block;margin-top:0.35rem}

.hero-scroll{
  position:absolute;bottom:1.75rem;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:0.5rem;
  opacity:0;animation:fade 1s 1.5s ease forwards;
}
.hscroll-bar{width:1px;height:2.5rem;background:linear-gradient(to bottom,var(--gold),transparent);animation:pulse 2s infinite}
.hscroll-txt{font-size:0.44rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--text3)}
@keyframes pulse{0%,100%{opacity:0.35}50%{opacity:1}}

/* ═══ SHARED ═══ */
.sep{height:1px;background:linear-gradient(to right,transparent,var(--line) 15%,var(--line) 85%,transparent);margin:0 1.25rem}
.sec{padding:5rem 1.25rem}
.eyebrow{
  display:flex;align-items:center;gap:0.7rem;
  font-size:0.5rem;letter-spacing:0.34em;text-transform:uppercase;color:var(--gold);
  margin-bottom:1.2rem;
}
.eyebrow::before{content:'';width:1.25rem;height:1px;background:var(--gold);opacity:0.55}
.sh2{
  font-family:'Cormorant Garamond',serif;font-weight:400;
  font-size:clamp(1.7rem,5vw,3rem);line-height:1.2;color:var(--cream);margin-bottom:1.4rem;
}
.sh2 em{color:var(--gold2);font-style:italic}

/* ═══ STORY ═══ */
.story-body{
  font-size:clamp(0.87rem,2vw,0.95rem);line-height:2.1;
  color:var(--text);margin-bottom:1.4rem;font-weight:300;
}
.story-body strong{color:var(--cream2);font-weight:400}
.pull{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(1.05rem,3vw,1.4rem);line-height:1.65;
  color:var(--gold2);border-left:1px solid var(--gold);
  padding-left:1.25rem;margin:2rem 0;
}
.stags{display:flex;flex-wrap:wrap;gap:0.45rem;margin-top:1.4rem}
.stag{
  font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;
  border:1px solid var(--line);padding:0.28rem 0.7rem;color:var(--gold);
}

/* ═══ PILLARS ═══ */
.pillars-grid{
  display:grid;grid-template-columns:1fr;
  border:1px solid var(--line);margin-top:1.75rem;
}
.pillar-card{
  padding:1.75rem 1.25rem;border-bottom:1px solid var(--line);
  position:relative;overflow:hidden;transition:background 0.3s;
}
.pillar-card:last-child{border-bottom:none}
.pillar-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:1.5px;
  background:var(--gold);transform:scaleY(0);transform-origin:bottom;transition:transform 0.45s ease;
}
.pillar-card:hover::before{transform:scaleY(1)}
.pillar-card:hover{background:rgba(184,147,90,0.025)}
.pillar-top{display:flex;align-items:baseline;gap:0.85rem;margin-bottom:0.65rem}
.pillar-idx{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.6rem;color:rgba(184,147,90,0.18);line-height:1;flex-shrink:0}
.pillar-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.1rem;color:var(--cream);letter-spacing:0.02em}
.pillar-desc{font-size:0
